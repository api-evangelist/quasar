openapi: 3.2.0
info:
  title: QuasarDB Max In Buffer Size API
  version: 3.15.0-nightly.0
  description: Find out more at https://doc.quasardb.net
servers:
- url: /api
security:
- Bearer: []
- UrlParam: []
tags:
- name: max-in-buffer-size
paths:
  /option/max-in-buffer-size:
    get:
      operationId: get-max-in-buffer-size
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QdbError'
      tags:
      - max-in-buffer-size
      summary: Get the client max in buffer size
components:
  schemas:
    QdbError:
      properties:
        message:
          type: string
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
    UrlParam:
      type: apiKey
      name: token
      in: query
