openapi: 3.2.0
info:
  title: QuasarDB Prometheus API
  version: 3.15.0-nightly.0
  description: Find out more at https://doc.quasardb.net
servers:
- url: /api
security:
- Bearer: []
- UrlParam: []
tags:
- name: Prometheus
paths:
  /prometheus/read:
    post:
      operationId: prometheusRead
      description: The read endpoint for remote Prometheus storage
      security: []
      responses:
        '200':
          description: OK
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
        '500':
          description: Internal Error.
          content:
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/QdbError'
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
        description: The samples in snappy-encoded protocol buffer format sent from Prometheus
        required: true
      tags:
      - Prometheus
      summary: Prometheus read
      x-summary-source: derived
  /prometheus/write:
    post:
      operationId: prometheusWrite
      description: The write endpoint for remote Prometheus storage
      security: []
      responses:
        '200':
          description: OK
        '500':
          description: Internal Error.
          content:
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/QdbError'
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
        description: The samples in snappy-encoded protocol buffer format sent from Prometheus
        required: true
      tags:
      - Prometheus
      summary: Prometheus write
      x-summary-source: derived
components:
  schemas:
    QdbError:
      properties:
        message:
          type: string
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
    UrlParam:
      type: apiKey
      name: token
      in: query
