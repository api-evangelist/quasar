name: Quasar
description: >-
  Quasar (QuasarDB, by Bureau 14) is a distributed, high-performance time-series database built for
  the hardest data problems, where precision, speed, scale, and accuracy must hold at the same time.
  It combines live ingestion, lossless-compressed historical retention, and heavy analytics on a
  single distributed system, deployed in cloud, edge, and appliance form across aerospace and defense,
  finance, industrial operations, and scientific research. QuasarDB exposes a JWT-authenticated REST
  API plus native client libraries in Python, Java, Go, .NET, C, PHP, R, and Ruby, and integrates with
  Grafana, Kafka, Spark, NATS, Prometheus, and Dask.
